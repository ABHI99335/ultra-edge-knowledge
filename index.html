<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Base | ULTRA EDGE</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="data.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');
        :root {
            --void: #000000; --panel: #0A0A0A; --panel-border: #222222;
            --amber: #FFB000; --ice: #6FB7D6; --text: #D1D5DB; --text-dim: #6B7280;
            --mono: 'JetBrains Mono', monospace; --sans: 'Inter', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
        body { background-color: var(--void); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.6; height: 100vh; display: flex; flex-direction: column; }
        .term-header { display: flex; justify-content: space-between; align-items: center; height: 48px; border-bottom: 1px solid var(--panel-border); padding: 0 24px; background: var(--void); position: sticky; top: 0; z-index: 100; }
        .term-brand { font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--amber); display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .term-brand span { color: var(--text-dim); font-size: 12px; }
        .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
        .nav-btn { background: transparent; border: 1px solid transparent; color: var(--text-dim); font-family: var(--mono); font-size: 11px; padding: 4px 12px; text-decoration: none; transition: all 0.2s; }
        .nav-btn:hover { color: var(--amber); border-color: var(--panel-border); text-decoration: none; }

        .kb-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 350px; border-right: 1px solid var(--panel-border); display: flex; flex-direction: column; background: var(--panel); }
        .header { padding: 16px; border-bottom: 1px solid var(--panel-border); font-family: var(--mono); color: var(--amber); font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: 0.05em; }
        .search-box { padding: 16px; border-bottom: 1px solid var(--panel-border); }
        .search-box input { width: 100%; padding: 10px; background: var(--void); border: 1px solid var(--panel-border); color: var(--amber); font-family: var(--mono); outline: none; }
        .search-box input:focus { border-color: var(--amber); }
        .tree-container { flex: 1; overflow-y: auto; padding: 10px; font-family: var(--mono); font-size: 12px; }

        details { margin-bottom: 4px; }
        summary { cursor: pointer; color: var(--ice); padding: 4px 0; outline: none; user-select: none; }
        summary:hover { color: var(--amber); }
        .tree-inner { padding-left: 16px; border-left: 1px solid #222; margin-left: 6px; }
        .file-item { padding: 4px 0; color: var(--text-dim); cursor: pointer; }
        .file-item:hover, .file-item.active { color: var(--amber); }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .main-header { padding: 16px 24px; border-bottom: 1px solid var(--panel-border); font-family: var(--mono); color: var(--amber); font-size: 14px; background: var(--panel); }
        .content-area { flex: 1; overflow-y: auto; padding: 40px; background: var(--void); color: var(--text); font-family: var(--mono); font-size: 13px; }

        .content-area pre { background: var(--panel); padding: 16px; border: 1px solid var(--panel-border); border-left: 4px solid var(--amber); color: var(--ice); overflow-x: auto; font-size: 12px; margin-bottom: 16px; white-space: pre-wrap; word-wrap: break-word; }
        .content-area code { font-family: var(--mono); }
        .content-area h1, .content-area h2, .content-area h3 { color: var(--amber); margin-top: 24px; margin-bottom: 12px; border-bottom: 1px solid var(--panel-border); padding-bottom: 8px; }
        .content-area a { color: var(--amber); }
        .content-area p { margin-bottom: 16px; line-height: 1.6; }
    </style>
</head>
<body>
    <header class="term-header">
        <a class="term-brand" href="https://abhi99335.github.io/ultra-edge-protocol/">ULTRA EDGE <span>▸ KNOWLEDGE BASE</span></a>
        <div class="nav-links">
            <a href="https://abhi99335.github.io/ultra-edge-protocol/" class="nav-btn">← BACK TO PORTFOLIO</a>
        </div>
    </header>

    <div class="kb-container">
        <div class="sidebar">
            <div class="header">MINDMAP</div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search files..." onkeyup="filterTree()">
            </div>
            <div class="tree-container" id="treeRoot"></div>
        </div>
        <div class="main-content">
            <div class="main-header" id="currentFile">Select a file to view</div>
            <div class="content-area" id="contentArea">Select a file from the mindmap.</div>
        </div>
    </div>

    <script>
        const files = filesData;
        
        const tree = {};
        files.forEach(f => {
            const parts = f.path.split('/');
            let current = tree;
            for (let i = 0; i < parts.length - 1; i++) {
                if (!current[parts[i]]) current[parts[i]] = { _type: 'dir', children: {} };
                current = current[parts[i]].children;
            }
            current[parts[parts.length - 1]] = { _type: 'file', data: f };
        });

        function buildTree(node, container) {
            Object.keys(node).sort().forEach(key => {
                const item = node[key];
                if (item._type === 'dir') {
                    const details = document.createElement('details');
                    if (key === '1 - Godfather' || key === '8 - Portfolio Multiverse') details.open = true; 
                    
                    const summary = document.createElement('summary');
                    summary.innerText = '📁 ' + key;
                    details.appendChild(summary);
                    
                    const inner = document.createElement('div');
                    inner.className = 'tree-inner';
                    buildTree(item.children, inner);
                    details.appendChild(inner);
                    container.appendChild(details);
                } else {
                    const div = document.createElement('div');
                    div.className = 'file-item';
                    div.innerText = '📄 ' + key;
                    div.onclick = () => {
                        document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
                        div.classList.add('active');
                        loadFile(item.data);
                    };
                    container.appendChild(div);
                }
            });
        }

        function loadFile(file) {
            document.getElementById('currentFile').innerText = file.path;
            let contentHtml = '';
            
            if (file.ext === 'md') {
                contentHtml = marked.parse(file.content);
            } else {
                const safeContent = file.content
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
                contentHtml = '<pre><code>' + safeContent + '</code></pre>';
            }
            document.getElementById('contentArea').innerHTML = contentHtml;
        }

        function filterTree() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const root = document.getElementById('treeRoot');
            root.innerHTML = '';
            
            if (!query) {
                buildTree(tree, root);
                return;
            }
            
            files.forEach(f => {
                if (f.path.toLowerCase().includes(query)) {
                    const div = document.createElement('div');
                    div.className = 'file-item';
                    div.innerText = '📄 ' + f.path;
                    div.onclick = () => {
                        document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
                        div.classList.add('active');
                        loadFile(f);
                    };
                    root.appendChild(div);
                }
            });
        }

        buildTree(tree, document.getElementById('treeRoot'));
    </script>
</body>
</html>
